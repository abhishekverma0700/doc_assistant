<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocAssist AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
    }

    /* ---- SIDEBAR ---- */
    #sidebar {
      width: 280px;
      background: #12122a;
      border-right: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
    }

    #logo {
      padding: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #a0a0ff;
      border-bottom: 1px solid #2a2a4a;
    }

    #upload-section {
      padding: 20px;
      border-bottom: 1px solid #2a2a4a;
    }

    #upload-section h3 {
      font-size: 13px;
      color: #7070aa;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #upload-box {
      display: block;
      border: 2px dashed #4a4a8a;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      color: #8080cc;
      font-size: 14px;
      transition: all 0.2s;
    }

    #upload-box:hover {
      border-color: #7070cc;
      color: #a0a0ff;
    }

    #upload-status {
      margin-top: 10px;
      font-size: 12px;
      color: #6060aa;
      text-align: center;
    }

    #upload-status.success { color: #60cc60; }
    #upload-status.error { color: #ff6b6b; }

    #doc-list-section {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    #doc-list-section h3 {
      font-size: 13px;
      color: #7070aa;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .doc-item {
      background: #1a1a3a;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #c0c0ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .doc-chunks {
      font-size: 11px;
      color: #6060aa;
    }

    /* ---- CHAT AREA ---- */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a4a;
      font-size: 15px;
      color: #a0a0ff;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-wrapper {
      display: flex;
    }

    .message-wrapper.user { justify-content: flex-end; }
    .message-wrapper.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 70%;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .bubble.user { background: #3a3a8a; color: #e0e0ff; }
    .bubble.assistant { background: #1e1e3a; color: #e0e0e0; }

    .sources-box {
      margin-top: 10px;
      border-top: 1px solid #3a3a6a;
      padding-top: 8px;
    }

    .sources-title {
      font-size: 12px;
      color: #a0a0ff;
      margin-bottom: 6px;
    }

    .source-item {
      background: #0f0f2a;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 4px;
    }

    .source-label {
      font-size: 11px;
      color: #7070bb;
      font-weight: bold;
    }

    .source-preview {
      font-size: 11px;
      color: #8080aa;
      margin-top: 2px;
    }

    .loading-bubble {
      background: #1e1e3a;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      color: #8080cc;
      max-width: 70%;
    }

    /* ---- INPUT AREA ---- */
    #input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #2a2a4a;
      align-items: flex-end;
    }

    #question-input {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #3a3a6a;
      border-radius: 10px;
      padding: 10px 14px;
      color: #e0e0e0;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    #question-input:focus { border-color: #6060aa; }

    #send-btn {
      background: #4a4aaa;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #6060cc; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #4a4a8a; border-radius: 3px; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="logo">🤖 DocAssist AI</div>

    <div id="upload-section">
      <h3>📄 Upload Document</h3>
      <label id="upload-box">
        📁 Click to upload PDF
        <input type="file" id="file-input" accept=".pdf" style="display:none" />
      </label>
      <p id="upload-status"></p>
    </div>

    <div id="doc-list-section">
      <h3>📂 Uploaded Documents</h3>
      <div id="doc-list"></div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div id="chat-area">
    <div id="chat-header">💬 Ask anything about your documents</div>

    <div id="messages">
      <!-- Welcome message -->
      <div class="message-wrapper assistant">
        <div class="bubble assistant">
          Hello! 👋 Upload a PDF from the sidebar and ask me anything about it!
        </div>
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="question-input"
        rows="2"
        placeholder="Ask a question about your document... (Enter to send)"
      ></textarea>
      <button id="send-btn">Send 🚀</button>
    </div>
  </div>

  <script>
    const uploadedDocs = []; // store doc_id list

    // ---- FILE UPLOAD ----
    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById("upload-status");

      if (!file.name.endsWith(".pdf")) {
        status.textContent = "❌ Only PDF files supported!";
        status.className = "error";
        return;
      }

      status.textContent = "⏳ Uploading and processing...";
      status.className = "";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("http://localhost:8000/upload", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || "Upload failed");

        // Save doc_id
        uploadedDocs.push(data.doc_id);
        uploadedDocs.push(data.doc_id);
        console.log("Doc uploaded, ID:", data.doc_id);
        console.log("All docs:", uploadedDocs);

        // Show success
        status.textContent = `✅ Uploaded! ${data.total_chunks} chunks created`;
        status.className = "success";

        // Add to doc list
        const docList = document.getElementById("doc-list");
        const item = document.createElement("div");
        item.className = "doc-item";
        item.innerHTML = `
          <span>📄 ${data.filename}</span>
          <span class="doc-chunks">${data.total_chunks} chunks</span>
        `;
        docList.appendChild(item);

      } catch (err) {
        status.textContent = `❌ ${err.message}`;
        status.className = "error";
      }

      // Reset file input
      e.target.value = "";
    });

    // ---- SEND MESSAGE ----
    async function sendMessage() {
      const input = document.getElementById("question-input");
      const question = input.value.trim();

      if (!question) return;

      if (uploadedDocs.length === 0) {
        alert("Please upload a document first!");
        return;
      }

      // Add user message
      addMessage("user", question);
      input.value = "";

      // Show loading
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message-wrapper assistant";
      loadingDiv.innerHTML = `<div class="loading-bubble">⏳ Thinking...</div>`;
      loadingDiv.id = "loading-msg";
      document.getElementById("messages").appendChild(loadingDiv);
      scrollToBottom();

      // Disable button
      document.getElementById("send-btn").disabled = true;

      try {
        const res = await fetch("http://localhost:8000/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: question,
            doc_ids: uploadedDocs,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Error getting answer");

        // Remove loading
        document.getElementById("loading-msg")?.remove();

        // Add bot message with sources
        addMessage("assistant", data.answer, data.sources);

      } catch (err) {
        document.getElementById("loading-msg")?.remove();
        addMessage("assistant", `❌ Error: ${err.message}`);
      }

      document.getElementById("send-btn").disabled = false;
    }

    // ---- ADD MESSAGE TO UI ----
    function addMessage(role, content, sources = []) {
      const messages = document.getElementById("messages");

      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${role}`;

      let sourcesHTML = "";
      if (sources && sources.length > 0) {
        sourcesHTML = `
       <div class="sources-box">
            <p class="sources-title">📚 Sources used:</p>
            ${sources.map(s => `
              <div class="source-item">
                <div class="source-label">Page ${s.page_number} — ${s.doc_id}</div>
                <div class="source-preview">${s.text_preview}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="bubble ${role}">
          ${content}
          ${sourcesHTML}
        </div>
      `;

      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function scrollToBottom() {
      const messages = document.getElementById("messages");
      messages.scrollTop = messages.scrollHeight;
    }

    // ---- ENTER KEY TO SEND ----
    document.getElementById("question-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("send-btn").addEventListener("click", sendMessage);
  </script>

</body>
</html>
