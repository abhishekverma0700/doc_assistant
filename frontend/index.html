<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DocAssist AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #e0e7ff;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 320px;
      background: rgba(15, 23, 42, 0.8);
      border-right: 1px solid rgba(99, 102, 241, 0.1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(99, 102, 241, 0.1);
    }

    #logo {
      padding: 24px;
      font-size: 20px;
      font-weight: 700;
      color: #6366f1;
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
      letter-spacing: -0.5px;
    }

    #upload-section {
      padding: 24px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
    }

    #upload-section h3 {
      font-size: 12px;
      color: #818cf8;
      text-transform: uppercase;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    #upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px dashed rgba(99, 102, 241, 0.3);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(99, 102, 241, 0.05);
    }

    #upload-box:hover { 
      border-color: rgba(99, 102, 241, 0.5);
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    #upload-status {
      margin-top: 12px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      min-height: 18px;
      animation: fadeIn 0.3s ease-in;
    }

    #upload-status.success { color: #10b981; font-weight: 500; }
    #upload-status.error { color: #ef4444; font-weight: 500; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #doc-list-section {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    #doc-list-section h3 {
      font-size: 12px;
      color: #818cf8;
      text-transform: uppercase;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    #doc-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .doc-item {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(139, 92, 246, 0.05) 100%);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      color: #c7d2fe;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .doc-item:hover {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
    }

    .doc-item::before {
      content: "📄";
      margin-right: 8px;
      font-size: 14px;
    }

    .doc-chunks { 
      font-size: 11px; 
      color: #818cf8; 
      background: rgba(99, 102, 241, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    /* ===== CHAT AREA ===== */
    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(10, 14, 39, 0.5);
    }

    #chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
      font-size: 15px;
      font-weight: 600;
      color: #c7d2fe;
      background: rgba(15, 23, 42, 0.4);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message-wrapper { display: flex; gap: 8px; }
    .message-wrapper.user { justify-content: flex-end; }
    .message-wrapper.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 70%;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bubble.user {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      font-weight: 500;
    }

    .bubble.assistant {
      background: rgba(30, 41, 59, 0.8);
      color: #e0e7ff;
      border: 1px solid rgba(99, 102, 241, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .sources-box {
      margin-top: 12px;
      border-top: 1px solid rgba(99, 102, 241, 0.2);
      padding-top: 12px;
    }

    .sources-title { 
      font-size: 12px; 
      color: #818cf8; 
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .source-item {
      background: rgba(99, 102, 241, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      border-left: 2px solid #6366f1;
      transition: all 0.2s ease;
    }

    .source-item:hover {
      background: rgba(99, 102, 241, 0.12);
      transform: translateX(2px);
    }

    .source-label { 
      font-size: 11px; 
      color: #a5b4fc; 
      font-weight: 600;
    }

    .source-preview { 
      font-size: 11px; 
      color: #94a3b8; 
      margin-top: 4px;
    }

    .loading-bubble {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 14px;
      color: #a5b4fc;
      max-width: 70%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ===== INPUT AREA ===== */
    #input-area {
      display: flex;
      gap: 12px;
      padding: 20px 24px;
      border-top: 1px solid rgba(99, 102, 241, 0.1);
      align-items: flex-end;
      background: rgba(15, 23, 42, 0.4);
    }

    #question-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: #e0e7ff;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      font-weight: 400;
      transition: all 0.3s ease;
    }

    #question-input:focus {
      border-color: rgba(99, 102, 241, 0.6);
      background: rgba(30, 41, 59, 0.8);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    #question-input::placeholder {
      color: #6b7280;
    }

    #send-btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    #send-btn:active:not(:disabled) {
      transform: translateY(0px);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== LOGIN SCREEN ===== */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeInScreen 0.4s ease-out;
    }

    @keyframes fadeInScreen {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    #login-screen.hidden {
      display: none;
    }

    .login-container {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 48px;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-title {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 32px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 12px;
      color: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .form-group input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      color: #e0e7ff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      font-weight: 400;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: rgba(99, 102, 241, 0.8);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .form-group input::placeholder {
      color: #4b5563;
    }

    #login-btn {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    #login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    #login-btn:active:not(:disabled) {
      transform: translateY(0px);
    }

    #login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #login-error {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    #logout-btn {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      width: 100%;
      margin-top: auto;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
    }

    #logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    #logout-btn:active {
      transform: translateY(0px);
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: min(84vw, 320px);
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
        z-index: 30;
      }

      #chat-area {
        width: 100%;
        min-width: 0;
        flex: 1;
      }

      #chat-header {
        padding: 16px 20px 16px 56px;
        font-size: 14px;
        line-height: 1.4;
        min-height: 56px;
        display: flex;
        align-items: center;
      }

      #chat-header::before {
        content: "☰";
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(99, 102, 241, 0.12);
        color: #c7d2fe;
        font-size: 20px;
        line-height: 1;
        border: 1px solid rgba(99, 102, 241, 0.18);
      }

      #messages {
        padding: 16px;
        gap: 12px;
      }

      .bubble,
      .loading-bubble {
        max-width: 90%;
        font-size: 15px;
        line-height: 1.55;
        padding: 12px 14px;
      }

      #input-area {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      }

      #question-input {
        width: 100%;
        min-height: 56px;
        font-size: 16px;
        padding: 14px 16px;
      }

      #send-btn,
      #login-btn,
      #logout-btn,
      #upload-box {
        min-height: 44px;
      }

      #send-btn,
      #login-btn,
      #logout-btn {
        width: 100%;
        font-size: 15px;
        padding: 14px 16px;
      }

      #upload-section,
      #doc-list-section {
        padding: 18px;
      }

      #logo {
        padding: 18px;
        font-size: 18px;
      }

      #upload-box {
        padding: 22px 18px;
        font-size: 14px;
      }

      .doc-item {
        padding: 14px;
        font-size: 14px;
      }

      .doc-chunks,
      .sources-title,
      .source-label,
      .source-preview,
      #upload-status,
      #login-error,
      .form-group label {
        font-size: 13px;
      }

      .login-container {
        width: calc(100% - 24px);
        max-width: none;
        padding: 28px 20px;
        border-radius: 18px;
      }

      .login-title {
        font-size: 28px;
        margin-bottom: 24px;
      }

      .login-form {
        gap: 14px;
      }

      .form-group input {
        min-height: 44px;
        font-size: 16px;
        padding: 12px 14px;
      }

      #login-btn {
        margin-top: 4px;
      }
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.6);
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-container">
      <div class="login-title">DocAssist AI</div>
      <form class="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" placeholder="demo" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="demo123" />
        </div>
        <div id="login-error"></div>
        <button type="button" id="login-btn">Login</button>
        <button type="button" id="register-btn" style="background:transparent;border:1px solid rgba(99,102,241,0.4);color:#a5b4fc;border-radius:10px;padding:14px;cursor:pointer;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;transition:all 0.3s ease;">Register</button>
      </form>
    </div>
  </div>

  <div id="sidebar">
    <div id="logo">DocAssist AI</div>

    <div id="upload-section">
      <h3>Upload Document</h3>
      <label id="upload-box">
         Click to upload PDF, DOCX or TXT
        <input type="file" id="file-input" accept=".pdf,.docx,.txt" style="display:none" />
      </label>
      <p id="upload-status"></p>
    </div>

    <div id="doc-list-section">
      <h3> Uploaded Documents</h3>
      <div id="doc-list"></div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>

  <div id="chat-area">
    <div id="chat-header">Ask anything about your documents</div>

    <div id="messages">
      <div class="message-wrapper assistant">
        <div class="bubble assistant">
          Hello! Upload a PDF, DOCX or TXT file and ask me anything about it!
        </div>
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="question-input"
        rows="2"
        placeholder="Ask a question... (Enter to send)"
      ></textarea>
      <button id="send-btn">Send </button>
    </div>
  </div>

  <script>
    const uploadedDocs = [];
    const API = "http://127.0.0.1:8000";
    let sessionId = null;
    let token = localStorage.getItem("token");

    function getAuthToken() {
      return localStorage.getItem("token") || "demo-token-123:demo";
    }

    // Initialize app based on token state
    async function initApp() {
      const token = localStorage.getItem("token");
      if (token) {
        document.getElementById("login-screen").classList.add("hidden");
        try {
          const res = await fetch(`${API}/documents`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await res.json();
          if (res.ok && data.documents) {
            data.documents.forEach(doc => {
              uploadedDocs.push(doc.doc_id);
              const docList = document.getElementById("doc-list");
              const item = document.createElement("div");
              item.className = "doc-item";
              item.innerHTML = `<span>${doc.filename}</span><span class="doc-chunks">${doc.total_chunks} chunks</span>`;
              docList.appendChild(item);
            });
          }
        } catch (err) {
          console.error("Failed to load documents:", err);
        }
      }
    }

    // Handle login
    document.getElementById("login-btn").addEventListener("click", async () => {
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();
      const errorDiv = document.getElementById("login-error");
      if (!username || !password) { errorDiv.textContent = "Please enter username and password"; return; }
      document.getElementById("login-btn").disabled = true;
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) { errorDiv.textContent = data.detail || "Login failed"; document.getElementById("login-btn").disabled = false; return; }
        const uname = data.username || username;
        localStorage.setItem("token", `demo-token-123:${uname}`);
        localStorage.setItem("username", uname);
        errorDiv.textContent = "";
        document.getElementById("login-btn").disabled = false;
        document.getElementById("login-screen").classList.add("hidden");
        initApp();
      } catch (err) {
        errorDiv.textContent = "Connection error";
        document.getElementById("login-btn").disabled = false;
      }
    });

    // Handle logout
    document.getElementById("logout-btn").addEventListener("click", async () => {
      try {
        await fetch(`${API}/auth/logout`, { method: "POST" });
      } catch (err) {
        console.error("Logout error:", err);
      }

      token = null;
      localStorage.removeItem("token");
  localStorage.removeItem("username");
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("question-input").value = "";
      uploadedDocs.length = 0;
      document.getElementById("doc-list").innerHTML = "";
      document.getElementById("messages").innerHTML = `
        <div class="message-wrapper assistant">
          <div class="bubble assistant">
            Hello! Upload a PDF, DOCX or TXT file and ask me anything about it!
          </div>
        </div>
      `;
    });

    // Initialize on page load
    initApp();

    document.getElementById("register-btn").addEventListener("click", async () => {
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();
      const errorDiv = document.getElementById("login-error");
      if (!username || !password) { errorDiv.textContent = "Please enter username and password"; return; }
      if (password.length < 4) { errorDiv.textContent = "Password must be at least 4 characters"; return; }
      document.getElementById("register-btn").disabled = true;
      try {
        const res = await fetch(`${API}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (!res.ok) { errorDiv.textContent = data.detail || "Registration failed"; document.getElementById("register-btn").disabled = false; return; }
        errorDiv.style.color = "#10b981";
        errorDiv.textContent = "Registered! Now login.";
        document.getElementById("register-btn").disabled = false;
      } catch (err) {
        errorDiv.textContent = "Connection error";
        document.getElementById("register-btn").disabled = false;
      }
    });

    
    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const status = document.getElementById("upload-status");
      const allowed = [".pdf", ".docx", ".txt"];
      const ext = file.name.substring(file.name.lastIndexOf(".")).toLowerCase();

      if (!allowed.includes(ext)) {
        status.textContent = " Only PDF, DOCX, TXT supported!";
        status.className = "error";
        return;
      }

      status.textContent = " Uploading and processing...";
      status.className = "";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch(`${API}/upload`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${getAuthToken()}` },
          body: formData,
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Upload failed");

        
        uploadedDocs.push(data.doc_id);
        console.log("Uploaded doc_id:", data.doc_id);
        console.log("All docs:", uploadedDocs);

        status.textContent = ` Done! ${data.total_chunks} chunks created`;
        status.className = "success";

    
        const docList = document.getElementById("doc-list");
        const item = document.createElement("div");
        item.className = "doc-item";
        item.innerHTML = `
          <span>${data.filename}</span>
          <span class="doc-chunks">${data.total_chunks} chunks</span>
        `;
        docList.appendChild(item);

      } catch (err) {
        console.error("Upload error:", err);
        status.textContent = `${err.message}`;
        status.className = "error";
      }

      e.target.value = "";
    });

    
    async function sendMessage() {
      const input = document.getElementById("question-input");
      const question = input.value.trim();

      if (!question) return;

      if (uploadedDocs.length === 0) {
        alert("Please upload a document first!");
        return;
      }

      addMessage("user", question);
      input.value = "";

      
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message-wrapper assistant";
      loadingDiv.id = "loading-msg";
      loadingDiv.innerHTML = `<div class="loading-bubble">⏳ Thinking...</div>`;
      document.getElementById("messages").appendChild(loadingDiv);
      scrollToBottom();

      document.getElementById("send-btn").disabled = true;

      try {
        const res = await fetch(`${API}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: question,
            doc_ids: uploadedDocs,
            session_id: sessionId,
          }),
        });

        const data = await res.json();
        console.log("Ask response:", data);

        if (!res.ok) throw new Error(data.detail || "Error getting answer");

        sessionId = data.session_id || sessionId;

        document.getElementById("loading-msg")?.remove();
        addMessage("assistant", data.answer, data.sources);

      } catch (err) {
        console.error("Ask error:", err);
        document.getElementById("loading-msg")?.remove();
        addMessage("assistant", `Error: ${err.message}`);
      }

      document.getElementById("send-btn").disabled = false;
    }


    function addMessage(role, content, sources = []) {
      const messages = document.getElementById("messages");

      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${role}`;

      let sourcesHTML = "";
      if (sources && sources.length > 0) {
        sourcesHTML = `
          <div class="sources-box">
            <p class="sources-title">Sources used:</p>
            ${sources.map(s => `
              <div class="source-item">
                <div class="source-label">Page ${s.page_number} — ${s.doc_id}</div>
                <div class="source-preview">${s.text_preview}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="bubble ${role}">
          ${content}
          ${sourcesHTML}
        </div>
      `;

      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function scrollToBottom() {
      const messages = document.getElementById("messages");
      messages.scrollTop = messages.scrollHeight;
    }

    
    document.getElementById("question-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("login-password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("login-btn").click();
      }
    });

    document.getElementById("send-btn").addEventListener("click", sendMessage);
  </script>

</body>
</html>
